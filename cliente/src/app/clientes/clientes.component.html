<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h4 fw-bold text-dark mb-0">
          <i class="bi bi-people text-success me-2"></i>Módulo de Clientes
        </h2>
        <p class="text-muted mb-0 small">Consumo de la API REST <code>/api/clientes</code></p>
      </div>
      <button class="btn btn-success d-flex align-items-center" (click)="cargarClientes()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refrescar
      </button>
    </div>

    <!-- Formulario para crear cliente -->
    <div class="card bg-light border mb-4">
      <div class="card-body">
        <h5 class="card-title fs-6 fw-bold mb-3">Registrar Nuevo Cliente</h5>
        <form (ngSubmit)="crear()">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Nombre Completo *</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoCliente.nombre" name="nombre" placeholder="Ej. Valentina González" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Correo Electrónico *</label>
              <input type="email" class="form-control" [(ngModel)]="nuevoCliente.email" name="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Ciudad</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoCliente.ciudad" name="ciudad" placeholder="Ciudad">
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-person-plus me-1"></i> Guardar Cliente
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted">Cargando directorio de clientes desde el backend...</p>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="alert alert-warning d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
      <div>{{ error }}</div>
    </div>

    <!-- Tabla de clientes -->
    <div *ngIf="!cargando" class="table-responsive">
      <table class="table table-hover table-striped align-middle border">
        <thead class="table-dark">
          <tr>
            <th style="width: 20%;">ID</th>
            <th style="width: 30%;">Nombre</th>
            <th style="width: 30%;">Correo Electrónico</th>
            <th style="width: 20%;">Ciudad</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of clientes">
            <td><code>{{ c.id }}</code></td>
            <td class="fw-bold">{{ c.nombre }}</td>
            <td>
              <a [href]="'mailto:' + c.email" class="text-decoration-none">
                <i class="bi bi-envelope me-1"></i>{{ c.email }}
              </a>
            </td>
            <td><span class="badge bg-secondary">{{ c.ciudad }}</span></td>
          </tr>
          <tr *ngIf="clientes.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No se encontraron clientes registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
