<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h4 fw-bold text-dark mb-0">
          <i class="bi bi-box-seam text-primary me-2"></i>Módulo de Productos
        </h2>
        <p class="text-muted mb-0 small">Consumo de la API REST <code>/api/productos</code></p>
      </div>
      <button class="btn btn-primary d-flex align-items-center" (click)="cargarProductos()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refrescar
      </button>
    </div>

    <!-- Formulario para crear producto -->
    <div class="card bg-light border mb-4">
      <div class="card-body">
        <h5 class="card-title fs-6 fw-bold mb-3">Registrar Nuevo Producto</h5>
        <form (ngSubmit)="crear()">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Nombre *</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoProducto.nombre" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Precio *</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoProducto.precio" name="precio" placeholder="Precio (ej. 49.99)" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Categoría</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoProducto.categoria" name="categoria" placeholder="Categoría">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Descripción</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoProducto.descripcion" name="descripcion" placeholder="Descripción">
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-plus-circle me-1"></i> Crear Producto
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Cargando productos desde el servidor...</p>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="alert alert-warning d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
      <div>{{ error }}</div>
    </div>

    <!-- Tabla de productos -->
    <div *ngIf="!cargando" class="table-responsive">
      <table class="table table-hover table-striped align-middle border">
        <thead class="table-dark">
          <tr>
            <th style="width: 15%;">ID</th>
            <th style="width: 25%;">Nombre</th>
            <th style="width: 15%;">Categoría</th>
            <th style="width: 15%;">Precio</th>
            <th style="width: 30%;">Descripción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of productos">
            <td><code>{{ p.id }}</code></td>
            <td class="fw-bold">{{ p.nombre }}</td>
            <td><span class="badge bg-info text-dark">{{ p.categoria }}</span></td>
            <td class="text-success fw-bold">${{ p.precio }}</td>
            <td class="text-muted small">{{ p.descripcion }}</td>
          </tr>
          <tr *ngIf="productos.length === 0">
            <td colspan="5" class="text-center text-muted py-4">No se encontraron productos disponibles.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
