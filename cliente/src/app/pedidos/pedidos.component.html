<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h4 fw-bold text-dark mb-0">
          <i class="bi bi-cart-check text-warning me-2"></i>Módulo de Pedidos
        </h2>
        <p class="text-muted mb-0 small">Consumo de la API REST <code>/api/pedidos</code></p>
      </div>
      <button class="btn btn-warning text-dark d-flex align-items-center fw-semibold" (click)="cargarPedidos()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refrescar
      </button>
    </div>

    <!-- Formulario para crear pedido -->
    <div class="card bg-light border mb-4">
      <div class="card-body">
        <h5 class="card-title fs-6 fw-bold mb-3">Registrar Nuevo Pedido</h5>
        <form (ngSubmit)="crear()">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small fw-semibold">Producto Solicitado *</label>
              <input type="text" class="form-control" [(ngModel)]="nuevoPedido.producto" name="producto" placeholder="Ej. Balón Spalding" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Cantidad *</label>
              <input type="number" min="1" class="form-control" [(ngModel)]="nuevoPedido.cantidad" name="cantidad" required>
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-warning text-dark fw-semibold">
              <i class="bi bi-cart-plus me-1"></i> Guardar Pedido
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-2 text-muted">Cargando órdenes de pedido desde el servidor...</p>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="alert alert-warning d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
      <div>{{ error }}</div>
    </div>

    <!-- Tabla de pedidos -->
    <div *ngIf="!cargando" class="table-responsive">
      <table class="table table-hover table-striped align-middle border">
        <thead class="table-dark">
          <tr>
            <th style="width: 20%;">ID</th>
            <th style="width: 35%;">Producto</th>
            <th style="width: 20%;">Cantidad</th>
            <th style="width: 25%;">Fecha</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of pedidos">
            <td><code>{{ p.id }}</code></td>
            <td class="fw-bold">{{ p.producto }}</td>
            <td><span class="badge bg-primary">{{ p.cantidad }} un.</span></td>
            <td class="text-muted small">{{ p.fecha | date:'medium' }}</td>
          </tr>
          <tr *ngIf="pedidos.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No se encontraron pedidos registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
